<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central Idea Mission | Grade 6</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#142943;background:#eaf1f9}*{box-sizing:border-box}body{margin:0}.shell{max-width:1000px;margin:auto;padding:24px}.top{background:linear-gradient(120deg,#102d55,#22649a);color:white;padding:26px;border-radius:20px}.top h1{margin:4px 0 8px;font-size:clamp(26px,4vw,38px)}.tag{font-size:13px;letter-spacing:1.3px;text-transform:uppercase;color:#c9ebff}.panel{background:white;border:1px solid #d8e5f1;border-radius:17px;padding:24px;margin-top:18px;box-shadow:0 6px 22px #173a5c0b}h2{margin-top:0;color:#153b64}h3{color:#195785}.muted{color:#50667c}.btn{background:#155a9a;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;font-size:15px;margin:4px 6px 4px 0}.btn:hover{background:#103f71}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#eef6ff;color:#154c80;border:1px solid #b7d5ed}.secondary:hover{background:#dceeff}.stop{background:#5b6474}.read{border-left:5px solid #64a5d2;background:#f6fbff;padding:15px 19px;border-radius:10px;line-height:1.78;font-size:18px}.read p{margin:0 0 16px}.step{display:inline-block;background:#e5f1ff;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:800}.question{padding:16px 0;border-top:1px solid #d9e7f3}.opts{display:grid;gap:9px;margin:12px 0}.opt{display:block;border:1px solid #cfdaea;padding:11px 14px;border-radius:11px;cursor:pointer;background:#fbfdff}.opt:has(input:checked){background:#e4f2ff;border-color:#1c68ab}.opt input{margin-right:9px;accent-color:#155a9a}.feedback{padding:12px;background:#eff8f2;border-radius:9px;margin-top:8px}.hidden{display:none!important}.bar{height:10px;background:#cddfed;border-radius:999px;overflow:hidden;margin-top:15px}.fill{height:100%;background:#5fb8dd;width:0;transition:width .3s}.layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}.small{font-size:14px}.quizcard{margin:18px 0}.result{font-size:50px;font-weight:900;color:#10568f}.sticky{position:sticky;top:0;background:#eaf1f9eE;padding:9px 0;z-index:2}@media(max-width:680px){.layout{grid-template-columns:1fr}.shell{padding:12px}.panel{padding:16px}.read{font-size:16px}}</style></head><body><div class="shell"><header class="top"><div class="tag">Grade 6 • Florida B.E.S.T. • ELA.6.R.2.2</div><h1>Central Idea Mission</h1><div>Find the Big Idea. Prove It with Details.</div><p>Independent reading practice • About 30 minutes • 20-question final quiz</p><div class="bar"><div id="prog" class="fill"></div></div></header><main id="screen"></main></div><script>
const passages=[{"title": "The City That Cooled Its Streets", "paragraphs": ["On a summer afternoon, two neighborhoods in the same city can feel surprisingly different. A street lined with trees may be several degrees cooler than a nearby block covered in asphalt. City planners have begun paying attention to this difference as summers become hotter. They are discovering that trees can do much more than decorate a sidewalk.", "Leaves provide shade, preventing some sunlight from heating roads and buildings. Trees also release water vapor through a process called transpiration, which can cool the surrounding air. In one neighborhood, volunteers planted young trees along routes that students use to walk to school. While the new trees will take years to provide wide patches of shade, residents expect the streets to become more comfortable over time.", "Planting trees, however, requires thoughtful planning. Roots need enough soil and water, and some species grow better in particular climates. City workers must also choose locations that do not interfere with power lines or sidewalks. Community groups often help by watering newly planted trees during dry months.", "Trees alone cannot solve every problem caused by extreme heat. Cities may also use lighter roofing materials, create shaded bus stops, and provide public cooling spaces. Still, planting and caring for trees is one practical way neighborhoods can reduce heat and improve everyday life."]}, {"title": "A Library Beyond the Building", "paragraphs": ["When people think of a library, they may picture shelves of books inside a quiet building. Yet in some communities, library services travel to readers. Mobile libraries—sometimes called bookmobiles—bring books and other resources to places where visiting a permanent library may be difficult.", "A mobile library might stop at an apartment complex on Tuesday, a park on Wednesday, and a community center on Thursday. Visitors can borrow and return books just as they would at a regular library. Some vehicles also carry tablets or provide internet access, helping people complete school assignments or search for information.", "These traveling services are particularly useful for residents who lack reliable transportation. Older adults, families with young children, and students may find it easier to visit a bookmobile near home. Librarians can also learn what a neighborhood needs by talking with visitors and adjusting which materials they bring on future trips.", "Running a mobile library takes planning. Fuel, staffing, and maintenance cost money, and the vehicle has less room for books than a building does. Weather or traffic can delay a scheduled visit. Even with those challenges, mobile libraries show that access to reading and information does not have to depend on living near a library building."]}, {"title": "When Students Became Citizen Scientists", "paragraphs": ["A sixth-grade science club wanted to know whether the creek near its school was changing throughout the year. Instead of making a guess after one visit, the students joined a citizen-science project. Citizen science allows volunteers to collect observations that researchers can study alongside other information.", "Every other Friday, club members visited the same safe observation point with their teacher. They recorded the water's appearance, measured its temperature with a classroom thermometer, and counted the kinds of insects they could see near the bank. The students entered their observations into a shared database using the same format each time.", "At first, some members thought their notes were too ordinary to matter. Then a researcher explained that repeated measurements help reveal patterns. One unusually warm reading might mean little on its own, but readings gathered over months can show whether a change is lasting or temporary. Consistent methods also make it easier to compare observations from different groups.", "By the end of the term, the club had developed a habit of asking careful questions and checking evidence before making claims. Their work did not prove what caused any changes in the creek, but it contributed useful observations. The students learned that meaningful scientific research often depends on patient teamwork and accurate records."]}];const questions=[{"p": 0, "q": "Which statement best expresses the central idea of the entire passage?", "o": ["Shade trees make city streets prettier.", "Thoughtfully planted and maintained trees can help cities manage heat.", "Every city should replace pavement with grass.", "Most people prefer walking rather than riding buses."], "a": 1}, {"p": 0, "q": "Which detail most directly supports the idea that trees can cool neighborhoods?", "o": ["Residents volunteer during dry months.", "Power lines can affect planting locations.", "Leaves shade surfaces and trees release water vapor.", "Different species grow in different climates."], "a": 2}, {"p": 0, "q": "What is the central idea of paragraph 3?", "o": ["Trees need careful selection and ongoing care to succeed.", "Tree roots always damage sidewalks.", "Volunteers should select every tree species.", "Planting a tree is simpler than caring for one."], "a": 0}, {"p": 0, "q": "How does paragraph 2 develop the central idea?", "o": ["It argues that city streets should close to traffic.", "It compares tree planting budgets in two cities.", "It describes only the appearance of shade trees.", "It explains how trees cool areas and gives an example of planting."], "a": 3}, {"p": 0, "q": "Which detail is LEAST relevant to a summary about how trees reduce heat?", "o": ["Leaves keep some sunlight off roads.", "Some species need particular growing conditions.", "Transpiration can cool nearby air.", "Street trees can make walking routes more comfortable."], "a": 1}, {"p": 0, "q": "What can the reader infer about newly planted trees?", "o": ["Their cooling benefits may increase as they mature.", "They immediately cool the whole city.", "They never need watering after planting.", "They prevent the need for shaded bus stops."], "a": 0}, {"p": 0, "q": "Why does the author mention lighter roofs and shaded bus stops in the final paragraph?", "o": ["To claim planting trees has failed.", "To introduce unrelated city history.", "To show that trees are one part of a broader response to heat.", "To prove that buses produce all neighborhood heat."], "a": 2}, {"p": 1, "q": "Which statement best expresses the passage's central idea?", "o": ["Traveling libraries extend access to reading and information despite challenges.", "Permanent libraries no longer serve communities.", "Bookmobiles are mainly designed to provide entertainment.", "Library vehicles can carry as many books as buildings."], "a": 0}, {"p": 1, "q": "Which detail BEST supports the claim that mobile libraries increase access?", "o": ["Traffic can delay scheduled stops.", "Mobile libraries have limited shelf space.", "Vehicles require fuel and maintenance.", "They visit neighborhoods where travel to a library may be difficult."], "a": 3}, {"p": 1, "q": "What is the central idea of paragraph 2?", "o": ["Mobile libraries must stop at parks.", "Mobile libraries bring varied services to scheduled community stops.", "Online information should replace printed books.", "Most readers borrow books only on Thursdays."], "a": 1}, {"p": 1, "q": "How does paragraph 3 help develop the passage's central idea?", "o": ["It lists the costs of maintaining bookmobiles.", "It explains the history of library construction.", "It identifies people who benefit and how librarians respond to their needs.", "It shows that vehicles have no scheduling problems."], "a": 2}, {"p": 1, "q": "Which is the strongest supporting detail for a central idea about adapting services to community needs?", "o": ["Librarians talk with visitors and adjust future materials.", "Vehicles are sometimes delayed by weather.", "Traditional libraries have quiet indoor rooms.", "Mobile libraries are sometimes called bookmobiles."], "a": 0}, {"p": 1, "q": "What does the final paragraph contribute to the text?", "o": ["It changes the topic to traffic safety.", "It argues that bookmobiles should stop lending books.", "It says the limitations make traveling libraries useless.", "It acknowledges obstacles while reinforcing the value of mobile libraries."], "a": 3}, {"p": 1, "q": "Which sentence would be the BEST objective summary of the passage?", "o": ["Bookmobiles are fun trucks that everyone should visit daily.", "Mobile libraries deliver books and other resources to communities, although operating them requires planning.", "All neighborhoods need identical library schedules and vehicles.", "Libraries use tablets, so printed books are becoming unnecessary."], "a": 1}, {"p": 2, "q": "What is the central idea of the passage?", "o": ["Creek insects are easy for students to identify.", "Thermometers are the most important scientific tools.", "Careful, repeated observations allow volunteers to contribute to research.", "Research requires students to visit a creek every Friday."], "a": 2}, {"p": 2, "q": "Which detail BEST supports the importance of consistent observations?", "o": ["Students recorded measurements at the same site using the same format.", "Students belonged to a sixth-grade club.", "The creek was near the school.", "The group met with a teacher."], "a": 0}, {"p": 2, "q": "What is the central idea of paragraph 3?", "o": ["A single reading is enough to explain changes in a creek.", "Researchers prefer observations that are unusual.", "Students should avoid collecting ordinary data.", "Repeated, consistent data can reveal patterns more clearly than one observation."], "a": 3}, {"p": 2, "q": "How does the researcher's explanation in paragraph 3 develop the central idea?", "o": ["It shows that experts should collect all data themselves.", "It explains why the students' ordinary, repeated observations have value.", "It proves the creek is getting warmer each year.", "It suggests the club should stop collecting observations."], "a": 1}, {"p": 2, "q": "Which conclusion is supported by the final paragraph?", "o": ["The students proved exactly what changed the creek.", "Every citizen-science project reaches a definite conclusion.", "Collecting reliable data can be valuable even without proving a cause.", "Scientific research does not require teamwork."], "a": 2}, {"p": 2, "q": "Which detail is LEAST necessary in a summary of the main idea?", "o": ["The club visited the creek every other Friday.", "Students used consistent procedures when recording data.", "A researcher explained the value of repeated observations.", "The project taught students to use evidence before making claims."], "a": 0}];
let stage=0,practice=[null,null],answers=Array(20).fill(null),submitted=false,started=Date.now();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let voice=null;function pickVoice(){const vs=window.speechSynthesis?.getVoices()||[];voice=vs.find(v=>/Google US English/i.test(v.name))||vs.find(v=>/Google.*English/i.test(v.name)&&v.lang.startsWith('en'))||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en'))||null;}if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(s){if(!('speechSynthesis'in window)){alert('Read aloud is not supported by this browser. Try Chrome or Safari.');return;}speechSynthesis.cancel();pickVoice();const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.91;u.pitch=1;if(voice)u.voice=voice;speechSynthesis.speak(u)}
function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function sayBtn(s,label='🔊 Read aloud'){return `<button class="btn secondary" onclick='speak(${JSON.stringify(s).replace(/'/g,'&#39;')})'>${label}</button>`}
function nav(n){stop();stage=n;draw();window.scrollTo({top:0,behavior:'instant'})}
function draw(){document.getElementById('prog').style.width=(stage/5*100)+'%';const el=document.getElementById('screen');if(stage===0)el.innerHTML=intro();else if(stage===1)el.innerHTML=lesson();else if(stage===2)el.innerHTML=guided();else if(stage===3)el.innerHTML=reading();else if(stage===4)el.innerHTML=quiz();else el.innerHTML=finish();}
function intro(){const t='Welcome to Central Idea Mission. Work independently. First, learn how to find a central idea and supporting details. Next, complete two practice questions. Then read three informational passages and complete the 20-question quiz. You can use the read aloud buttons at any time. Keep your work on your own screen. When finished, screenshot your score for Canvas.';return `<section class="panel"><span class="step">START HERE</span><h2>Student directions</h2><p>Enter your first and last name. Complete every step <b>independently</b>. Use headphones if you choose the audio buttons.</p>${sayBtn(t,'🔊 Read directions')}<button class="btn stop" onclick="stop()">■ Stop audio</button><p><label><b>First and last name</b><br><input id="student" placeholder="First Last" style="padding:13px;width:min(100%,380px);border:1px solid #aac3db;border-radius:9px;font-size:17px" value="${esc(sessionStorage.getItem('ciName')||'')}"></label></p><div class="layout"><div class="read"><b>Learning target</b><p>I can determine a central idea, select supporting details, and explain how the central idea develops throughout an informational text.</p></div><div class="read"><b>Today's plan</b><p>5 min lesson + 5 min practice + 8 min reading + 12 min quiz = about 30 minutes.</p></div></div><p class="muted small">Audio uses a Google US English voice when available on your device; otherwise it uses another English voice installed in your browser. Works offline after opening the downloaded HTML file.</p><button class="btn" onclick="begin()">Begin lesson →</button></section>`}
function begin(){const n=document.getElementById('student').value.trim();if(n.split(/\s+/).length<2){alert('Please enter first and last name.');return;}sessionStorage.setItem('ciName',n);nav(1)}
function lesson(){const t='A topic is what a text is mostly about. A central idea is the most important message the author communicates about that topic. Supporting details are facts, examples, and explanations that prove or develop the central idea. Look for an idea supported by several paragraphs, not just one interesting fact. Ask: What is the author teaching me about this topic?';return `<section class="panel"><span class="step">PART 1 • ABOUT 5 MINUTES</span><h2>Learn: Central Idea and Supporting Details</h2>${sayBtn(t,'🔊 Read mini-lesson')}<div class="read"><p><b>Topic</b> = the subject (one word or short phrase).</p><p><b>Central idea</b> = the author's overall point about that subject (a complete statement).</p><p><b>Supporting details</b> = facts, examples, and explanations that help prove the central idea.</p><p><b>Development</b> = how the author builds the idea from the beginning through the middle to the end.</p></div><h3>Example</h3><div class="read"><p>Some schools create gardens where students grow vegetables. In science, students measure plant growth and observe insects. During math lessons, they calculate garden areas and record harvest totals. Caring for plants also teaches students responsibility.</p></div>${sayBtn('Some schools create gardens where students grow vegetables. In science, students measure plant growth and observe insects. During math lessons, they calculate garden areas and record harvest totals. Caring for plants also teaches students responsibility.','🔊 Read example')}<p><b>Topic:</b> School gardens</p><p><b>Central idea:</b> School gardens offer several kinds of learning opportunities.</p><p><b>Evidence:</b> Students practice science, math, and responsibility.</p><p><b>Strategy:</b> Name the topic → Ask what the passage explains about it → Locate 2 or more supporting details → Check that the idea fits the whole text.</p><button class="btn" onclick="nav(2)">Try independent practice →</button></section>`}
const ps=[{p:'At the beach, volunteers collect discarded fishing line, bottle caps, and wrappers. Removing this litter helps protect wildlife from swallowing trash or becoming tangled in it. Volunteers also record what they find so local leaders can identify common sources of pollution.',q:'What is the strongest central idea?',o:['Beaches have many kinds of shells.','Beach cleanups can protect wildlife and provide useful information.','Plastic bottle caps are the only harmful litter.','Volunteers should avoid keeping records.'],a:1,why:'The passage describes both protecting animals and collecting information.'},{p:'At first, the new school recycling bins were rarely used. Student leaders placed clear labels above each opening and made a short demonstration video. Within a month, more students sorted paper, plastic, and trash correctly.',q:'Which detail best shows how students improved recycling?',o:['The bins were new.','Some students had not used the bins.','Student leaders added labels and a demonstration video.','Schools have trash containers.'],a:2,why:'Labels and a demonstration show the actions that produced improvement.'}];
function guided(){const dir='Read each short passage. Select one answer for each question. Check your work to see an explanation. This is practice, not part of the final score.';return `<section class="panel"><span class="step">PART 2 • ABOUT 5 MINUTES</span><h2>Practice on Your Own</h2>${sayBtn(dir,'🔊 Read practice directions')} ${ps.map((x,i)=>`<div class="question"><h3>Practice ${i+1}</h3><div class="read">${esc(x.p)}</div>${sayBtn(x.p,'🔊 Read passage')}<p><b>${esc(x.q)}</b></p>${sayBtn(x.q+' '+x.o.map((y,j)=>String.fromCharCode(65+j)+'. '+y).join('. '),'🔊 Read question and choices')}<div class="opts">${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="p${i}" value="${j}" ${practice[i]===j?'checked':''} onchange="practice[${i}]=${j};draw()">${'ABCD'[j]}. ${esc(o)}</label>`).join('')}</div>${practice[i]!==null?`<div class="feedback">${practice[i]===x.a?'✓ Great work.':'Review the evidence.'} ${esc(x.why)}</div>`:''}</div>`).join('')}<button class="btn" onclick="nav(3)">Read the quiz passages →</button></section>`}
function passageHTML(p,i){return `<article class="panel"><h2>Passage ${i+1}: ${esc(p.title)}</h2>${sayBtn(p.title+'. '+p.paragraphs.join(' '),'🔊 Read entire passage')} <button class="btn stop" onclick="stop()">■ Stop audio</button><div class="read">${p.paragraphs.map((x,j)=>`<p><b>${j+1}.</b> ${esc(x)}</p>`).join('')}</div></article>`}
function reading(){const d='Read all three passages carefully. You can listen while following along with the words. The passages will be available during the quiz. When you finish reading, begin the quiz.';return `<section class="panel"><span class="step">PART 3 • ABOUT 8 MINUTES</span><h2>Read the Informational Texts</h2>${sayBtn(d,'🔊 Read directions')}<p>Read each passage yourself or use the audio. Pay attention to ideas repeated or developed across paragraphs.</p></section>${passages.map(passageHTML).join('')}<section class="panel"><button class="btn" onclick="nav(4)">Begin 20-question quiz →</button></section>`}
function quiz(){const d='Answer all 20 questions independently. For each question, choose the single best answer. You may reread or listen to the passage, the question, and the choices. When all questions are answered, select Submit quiz. Your score will then be final.';let count=answers.filter(x=>x!==null).length;return `<section class="panel sticky"><span class="step">PART 4 • ABOUT 12 MINUTES</span><h2>Final Quiz: ${count}/20 answered</h2>${sayBtn(d,'🔊 Read quiz directions')} <button class="btn stop" onclick="stop()">■ Stop audio</button><p class="small">All questions must be answered before submitting. Passages are included below each section.</p><div class="bar"><div class="fill" style="width:${count*5}%"></div></div></section>${passages.map((p,pi)=>`<div class="quizcard">${passageHTML(p,pi)}<section class="panel">${questions.map((q,i)=>q.p===pi?`<div class="question"><h3>Question ${i+1} of 20</h3><p><b>${esc(q.q)}</b></p>${sayBtn(q.q+' '+q.o.map((o,j)=>'Answer '+String.fromCharCode(65+j)+'. '+o).join(' '),'🔊 Read question & choices')}<div class="opts">${q.o.map((o,j)=>`<label class="opt"><input name="q${i}" type="radio" value="${j}" ${answers[i]===j?'checked':''} onchange="answer(${i},${j})">${'ABCD'[j]}. ${esc(o)}</label>`).join('')}</div></div>`:'').join('')}</section></div>`).join('')}<section class="panel"><b>Ready to finish?</b><p>You have answered <span id="answered">${count}</span> out of 20 questions.</p><button class="btn" onclick="submitQuiz()">Submit final quiz</button><p class="small muted">Your results will appear immediately. Screenshot the result for Canvas.</p></section>`}
function answer(i,v){answers[i]=v;document.getElementById('answered').textContent=answers.filter(x=>x!==null).length;document.querySelector('.sticky h2').textContent='Final Quiz: '+answers.filter(x=>x!==null).length+'/20 answered';document.querySelector('.sticky .fill').style.width=(answers.filter(x=>x!==null).length*5)+'%'}
function submitQuiz(){if(answers.some(x=>x===null)){alert('Please answer all 20 questions before submitting.');return;}if(!confirm('Submit your final answers? You will see your score and cannot change answers afterward.'))return;submitted=true;sessionStorage.setItem('ciLastResult',JSON.stringify({name:sessionStorage.getItem('ciName'),answers,time:new Date().toLocaleString()}));nav(5)}
function finish(){const score=questions.reduce((n,q,i)=>n+(answers[i]===q.a?1:0),0);const mins=Math.max(1,Math.round((Date.now()-started)/60000));let d=`You have completed your independent central idea practice. Your score is ${score} out of 20, which is ${score*5} percent. Take a screenshot of this screen and upload it to Canvas.`;return `<section class="panel" style="text-align:center"><span class="step">ACTIVITY COMPLETE</span><h2>Central Idea Mission — Results</h2><p><b>Student:</b> ${esc(sessionStorage.getItem('ciName')||'Student')}</p><p><b>Date and time:</b> ${esc(new Date().toLocaleString())}</p><div class="result">${score} / 20</div><h2>${score*5}%</h2><p>${score>=16?'Strong understanding!':score>=12?'Keep practicing how details develop central ideas.':'Review the central idea strategy and supporting evidence.'}</p>${sayBtn(d,'🔊 Read results')}<p><b>Approximate time on activity:</b> ${mins} minutes</p><div class="read" style="text-align:left"><b>What to submit:</b> Take a screenshot of this score screen and upload it to your Canvas assignment.</div><button class="btn secondary" onclick="window.print()">Print / Save Result</button><p class="muted small">Final quiz submitted. Answers are not shown on the student result screen.</p></section>`}
draw();
</script></body></html>
